<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Planner</title> 
  <meta name="description" content="Your minimal daily focus planner" />
  <meta name="theme-color" content="#0a0a0f"   />

   <!-- PWA -->  
  <link rel="manifest" href="manifest.json" />

  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Focus" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #c8f060;
      --accent2: #7b61ff; 
      --text: #f0f0f5;
      --muted: #6b6b80;
      --danger: #ff5f6d;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      padding: calc(var(--safe-top) + 20px) 24px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      border-bottom: 1px solid var(--border);
    }
    .header-left h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .header-left h1 span { color: var(--accent); font-style: italic; }
    .date-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* TABS */
    .tabs { display: flex; gap: 4px; padding: 16px 24px; background: var(--bg); }
    .tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
      color: var(--muted);
    }
    .tab.active { background: var(--accent); color: #0a0a0f; }

    /* PANELS */
    .panel { display: none; padding: 0 24px 120px; }
    .panel.active { display: block; }

    /* STATS */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-card .num {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      color: var(--accent);
      line-height: 1;
    }
    .stat-card .label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* SECTION LABEL */
    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* INPUT */
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .task-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .task-input:focus { border-color: var(--accent); }
    .task-input::placeholder { color: var(--muted); }
    .add-btn {
      width: 50px; height: 50px;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      color: #0a0a0f;
    }
    .add-btn:active { transform: scale(0.93); opacity: 0.85; }

    /* TASKS */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideIn 0.25s ease;
      transition: opacity 0.2s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .task-item.done { opacity: 0.45; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
    .check-btn {
      width: 24px; height: 24px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .check-btn.checked { background: var(--accent); border-color: var(--accent); }
    .check-icon { display: none; color: #0a0a0f; font-size: 13px; font-weight: 700; }
    .check-btn.checked .check-icon { display: block; }
    .task-text { flex: 1; font-size: 15px; line-height: 1.4; }
    .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .delete-btn {
      background: none; border: none;
      color: var(--muted); font-size: 18px;
      cursor: pointer; padding: 4px; line-height: 1;
      opacity: 0; transition: opacity 0.2s, color 0.2s;
    }
    .task-item:hover .delete-btn,
    .task-item:active .delete-btn { opacity: 1; }
    .delete-btn:active { color: var(--danger); }

    /* TIMER */
    .timer-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 0; }
    .timer-ring-wrap { position: relative; width: 240px; height: 240px; margin-bottom: 32px; }
    .timer-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring-bg { fill: none; stroke: var(--surface); stroke-width: 8; }
    .ring-progress {
      fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    .timer-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .timer-display {
      font-family: 'DM Serif Display', serif;
      font-size: 52px; font-weight: 400;
      letter-spacing: -2px; line-height: 1;
    }
    .timer-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
    .timer-controls { display: flex; gap: 16px; margin-bottom: 32px; }
    .ctrl-btn {
      width: 64px; height: 64px;
      border-radius: 50%; border: none;
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s;
    }
    .ctrl-btn:active { transform: scale(0.92); }
    .ctrl-btn.primary { background: var(--accent); color: #0a0a0f; font-size: 26px; width: 72px; height: 72px; }
    .ctrl-btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .preset-row { display: flex; gap: 8px; }
    .preset-btn {
      flex: 1; padding: 10px 0;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .preset-btn.active, .preset-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* NOTES */
    .notes-area {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; line-height: 1.7;
      outline: none; resize: none; min-height: 200px;
      transition: border-color 0.2s;
    }
    .notes-area:focus { border-color: var(--accent2); }
    .notes-area::placeholder { color: var(--muted); }
    .notes-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
    .char-count { font-size: 12px; color: var(--muted); }

    /* INSTALL BANNER */
    #install-banner {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 20px);
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 382px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      z-index: 100;
      box-shadow: 0 8px 40px rgba(200,240,96,0.12);
      animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
    }
    #install-banner.hidden { display: none; }
    .install-icon {
      width: 44px; height: 44px;
      background: var(--accent); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .install-text { flex: 1; }
    .install-text strong { font-size: 14px; display: block; margin-bottom: 2px; }
    .install-text span { font-size: 12px; color: var(--muted); }
    .install-cta {
      background: var(--accent); border: none;
      border-radius: 10px; padding: 8px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500;
      cursor: pointer; color: #0a0a0f;
      white-space: nowrap; flex-shrink: 0;
    }
    .dismiss-btn {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none;
      color: var(--muted); font-size: 18px;
      cursor: pointer; line-height: 1;
    }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 14px; line-height: 1.6; }

    /* TOAST */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 80px);
      left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 10px 20px; border-radius: 100px;
      font-size: 13px; font-weight: 500;
      z-index: 200; opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* iOS install guide */
    #ios-guide {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 300;
      display: flex; align-items: flex-end;
      padding: 24px;
    }
    #ios-guide.hidden { display: none; }
    .ios-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
    }
    .ios-card h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px; margin-bottom: 16px;
    }
    .ios-step {
      display: flex; gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .step-num {
      width: 28px; height: 28px;
      background: var(--accent); color: #0a0a0f;
      border-radius: 8px; font-weight: 700;
      font-size: 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .step-text { font-size: 14px; line-height: 1.5; color: var(--muted); padding-top: 4px; }
    .step-text strong { color: var(--text); }
    .ios-close {
      width: 100%; padding: 14px;
      background: var(--accent); border: none;
      border-radius: 14px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500;
      color: #0a0a0f; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>fo<span>cus</span></h1>
  </div>
  <div class="date-pill" id="date-pill"></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('tasks', this)">Tasks</button>
  <button class="tab" onclick="switchTab('timer', this)">Timer</button>
  <button class="tab" onclick="switchTab('notes', this)">Notes</button>
</div>

<!-- TASKS -->
<div class="panel active" id="panel-tasks">
  <div class="stats">
    <div class="stat-card">
      <div class="num" id="stat-total">0</div>
      <div class="label">Total</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-done">0</div>
      <div class="label">Done</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-left">0</div>
      <div class="label">Left</div>
    </div>
  </div>
  <div class="section-label">Today's tasks</div>
  <div class="input-row">
    <input class="task-input" id="task-input" placeholder="Add a task..." maxlength="80" />
    <button class="add-btn" onclick="addTask()">+</button>
  </div>
  <div class="task-list" id="task-list"></div>
</div>

<!-- TIMER -->
<div class="panel" id="panel-timer">
  <div class="timer-wrap">
    <div class="timer-ring-wrap">
      <svg viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="108" />
        <circle class="ring-progress" id="ring-progress" cx="120" cy="120" r="108"
          stroke-dasharray="678.58" stroke-dashoffset="0" />
      </svg>
      <div class="timer-center">
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-label" id="timer-label">Focus</div>
      </div>
    </div>
    <div class="timer-controls">
      <button class="ctrl-btn secondary" onclick="resetTimer()">↺</button>
      <button class="ctrl-btn primary" id="play-btn" onclick="toggleTimer()">▶</button>
      <button class="ctrl-btn secondary" onclick="skipTimer()">⇥</button>
    </div>
    <div class="preset-row">
      <button class="preset-btn active" onclick="setPreset(25,'Focus',this)">25 min</button>
      <button class="preset-btn" onclick="setPreset(10,'Short Break',this)">10 min</button>
      <button class="preset-btn" onclick="setPreset(5,'Break',this)">5 min</button>
    </div>
  </div>
</div>

<!-- NOTES -->
<div class="panel" id="panel-notes">
  <div class="section-label">Quick notes</div>
  <textarea class="notes-area" id="notes-area"
    placeholder="Jot down thoughts, ideas, anything..."
    maxlength="3000"
    oninput="saveNotes(); updateCharCount()"></textarea>
  <div class="notes-footer">
    <span class="char-count" id="char-count">0 / 3000</span>
  </div>
</div>

<!-- INSTALL BANNER (Android) -->
<div id="install-banner" class="hidden">
  <div class="install-icon">📱</div>
  <div class="install-text">
    <strong>Add to Home Screen</strong>
    <span>Install for offline access</span>
  </div>
  <button class="install-cta" id="install-btn">Install</button>
  <button class="dismiss-btn" onclick="dismissInstall()">×</button>
</div>

<!-- iOS INSTALL GUIDE -->
<div id="ios-guide" class="hidden">
  <div class="ios-card">
    <h3>Install on iPhone</h3>
    <div class="ios-step">
      <div class="step-num">1</div>
      <div class="step-text">Tap the <strong>Share button</strong> (⬆) at the bottom of Safari</div>
    </div>
    <div class="ios-step">
      <div class="step-num">2</div>
      <div class="step-text">Scroll down and tap <strong>"Add to Home Screen"</strong></div>
    </div>
    <div class="ios-step">
      <div class="step-num">3</div>
      <div class="step-text">Tap <strong>"Add"</strong> in the top right — done! 🎉</div>
    </div>
    <button class="ios-close" onclick="document.getElementById('ios-guide').classList.add('hidden')">Got it</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// DATE
const now = new Date();
document.getElementById('date-pill').textContent =
  now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).toUpperCase();

// TASKS
const TASK_KEY = 'focus_tasks_' + now.toDateString();
let tasks = JSON.parse(localStorage.getItem(TASK_KEY) || '[]');
const COLORS = ['#c8f060','#7b61ff','#ff5f6d'];

function saveTasks() { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); }

function addTask() {
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;
  tasks.unshift({ id: Date.now(), text, done: false, color: COLORS[tasks.length % 3] });
  input.value = '';
  saveTasks(); renderTasks();
  showToast('Task added ✓');
}

document.getElementById('task-input').addEventListener('keydown', e => { if (e.key==='Enter') addTask(); });

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; saveTasks(); renderTasks(); }
}

function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); saveTasks(); renderTasks(); }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTasks() {
  const done = tasks.filter(t => t.done).length;
  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-left').textContent = tasks.length - done;
  const list = document.getElementById('task-list');
  if (!tasks.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">✦</div><p>Nothing yet.<br/>Add your first task above.</p></div>`;
    return;
  }
  list.innerHTML = tasks.map(t => `
    <div class="task-item ${t.done?'done':''}">
      <button class="check-btn ${t.done?'checked':''}" onclick="toggleTask(${t.id})">
        <span class="check-icon">✓</span>
      </button>
      <span class="task-text">${esc(t.text)}</span>
      <div class="priority-dot" style="background:${t.color}"></div>
      <button class="delete-btn" onclick="deleteTask(${t.id})">×</button>
    </div>`).join('');
}
renderTasks();

// TABS
function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
}

// TIMER
let totalSecs=25*60, remaining=totalSecs, timerInterval=null, running=false, presetLabel='Focus';
const C = 2 * Math.PI * 108;

function updateTimerDisplay() {
  const m = String(Math.floor(remaining/60)).padStart(2,'0');
  const s = String(remaining%60).padStart(2,'0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  document.getElementById('ring-progress').style.strokeDashoffset = C * (remaining/totalSecs);
  document.getElementById('timer-label').textContent = presetLabel;
}

function toggleTimer() {
  running = !running;
  document.getElementById('play-btn').textContent = running ? '⏸' : '▶';
  if (running) {
    timerInterval = setInterval(() => {
      if (remaining <= 0) {
        clearInterval(timerInterval); running=false;
        document.getElementById('play-btn').textContent='▶';
        showToast('Session complete! 🎉'); return;
      }
      remaining--; updateTimerDisplay();
    }, 1000);
  } else { clearInterval(timerInterval); }
}

function resetTimer() {
  clearInterval(timerInterval); running=false; remaining=totalSecs;
  document.getElementById('play-btn').textContent='▶'; updateTimerDisplay();
}
function skipTimer() {
  clearInterval(timerInterval); running=false; remaining=0;
  document.getElementById('play-btn').textContent='▶'; updateTimerDisplay();
}
function setPreset(mins, label, btn) {
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  presetLabel=label; totalSecs=mins*60; remaining=totalSecs;
  clearInterval(timerInterval); running=false;
  document.getElementById('play-btn').textContent='▶'; updateTimerDisplay();
}
updateTimerDisplay();

// NOTES
const notesArea = document.getElementById('notes-area');
notesArea.value = localStorage.getItem('focus_notes') || '';
function saveNotes() { localStorage.setItem('focus_notes', notesArea.value); }
function updateCharCount() { document.getElementById('char-count').textContent=`${notesArea.value.length} / 3000`; }
updateCharCount();

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// PWA INSTALL — Android
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('install-banner').classList.remove('hidden');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('install-banner').classList.add('hidden');
  if (outcome==='accepted') showToast('App installed! 🎉');
});
function dismissInstall() { document.getElementById('install-banner').classList.add('hidden'); }

// PWA INSTALL — iOS detection
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
if (isIOS && !isStandalone && !localStorage.getItem('ios-guide-shown')) {
  setTimeout(() => { document.getElementById('ios-guide').classList.remove('hidden'); }, 1500);
  localStorage.setItem('ios-guide-shown','1');
}

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
